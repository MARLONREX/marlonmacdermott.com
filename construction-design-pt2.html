<meta name="description" content="A steel-clad countryside café connecting visitors with estate paths and bridleways."><style>.folder-project-copy p{margin:0 0 1.25em}
.sidebar-name{font-size:13px;font-weight:600}.project-menu a,.project-menu button{color:#3d3d3d;font-weight:500}.project-menu .gallery-link{color:#3d3d3d;font-weight:700}.project-menu a:hover{color:#343434}@media(max-width:820px){.sidebar-name{font-size:12px}}
/* Café page reading and navigation refinements. */
.folder-project-copy { font-size:16px; line-height:1.6; }
.folder-project-header h1 { font-weight:300; letter-spacing:-.035em; }
.project-menu { gap:23px; }
@media(max-width:820px) {
  .folder-project-copy { font-size:14px; }
  .project-menu { gap:22px; }
}
/* Shared title/copy column and a separate, quiet image scroll area. */
.folder-project-header { container-type:inline-size; }
.folder-project-header h1[data-folder-title] { white-space:nowrap; font-size:min(112px,9.3cqi); line-height:1.05; }
.folder-project-images { scrollbar-width:none; -ms-overflow-style:none; }
.folder-project-images::-webkit-scrollbar { width:0; height:0; display:none; }
@media(min-width:821px) {
  html:has(.folder-project-page) { overflow:hidden; }
  .folder-project-page { height:100dvh; overflow:hidden; }
  .folder-project-main {
    height:100dvh; min-height:0;
    padding-bottom:28px;
    display:grid;
    grid-template-columns:minmax(280px,.8fr) minmax(420px,1.35fr);
    grid-template-rows:auto minmax(0,1fr) auto;
    column-gap:clamp(45px,8vw,130px); row-gap:28px;
  }
  .folder-project-layout { display:contents; }
  .folder-project-header { grid-column:1 / -1; grid-row:1; margin:0; min-width:0; }
  .folder-project-copy { grid-column:1; grid-row:2; position:static; min-height:0; overflow:hidden; }
  .folder-project-back { grid-column:1; grid-row:3; margin:0; }
  .folder-project-images { grid-column:2; grid-row:2 / 4; height:100%; min-height:0; overflow-y:auto; overscroll-behavior:contain; }
  .folder-project-images figure { flex-shrink:0; }
}
@media(min-width:821px) {
  .folder-project-main { grid-template-rows:var(--title-row, auto) minmax(0,1fr) auto; }
}
.folder-project-header h1 { color:#3d3d3d; }
/* Light magnetic settling, with free scrolling inside taller images. */
@media(min-width:821px) {
  .folder-project-images { scroll-snap-type:y mandatory; scroll-behavior:smooth; }
  .folder-project-images figure { scroll-snap-align:start; scroll-snap-stop:normal; }
}
@media(prefers-reduced-motion:reduce) {
  .folder-project-images { scroll-behavior:auto; scroll-snap-type:none; }
}
.image-viewer { border:0; padding:0; background:transparent; max-width:96vw; max-height:94dvh; overflow:visible; }
.image-viewer::backdrop { background:rgba(0,0,0,.88); }
.image-viewer img { display:block; max-width:94vw; max-height:90dvh; width:auto; height:auto; object-fit:contain; }
.image-viewer-close { position:fixed; top:16px; right:20px; width:44px; height:44px; border:0; border-radius:50%; background:#fff; color:#222; font:30px/1 Arial,sans-serif; cursor:pointer; }

.folder-project-copy:empty::before { content:none; display:none; }

<dialog class="image-viewer" aria-label="Enlarged project image">
  <button class="image-viewer-close" type="button" aria-label="Close image">×</button>
  <img alt="">
</dialog>
<script>
const main = document.querySelector('.folder-project-main');
const menu = document.querySelector('.project-menu');
function alignProjectContent() {
  if (!matchMedia('(min-width:821px)').matches) {
    main.style.removeProperty('--title-row');
    return;
  }
  const style = getComputedStyle(main);
  const contentTop = main.getBoundingClientRect().top + parseFloat(style.paddingTop);
  const rowHeight = menu.getBoundingClientRect().top - contentTop - parseFloat(style.rowGap);
  main.style.setProperty('--title-row', `${Math.max(0, rowHeight)}px`);
}
new ResizeObserver(alignProjectContent).observe(menu);
window.addEventListener('resize', alignProjectContent);
document.fonts.ready.then(alignProjectContent);
alignProjectContent();
const images = document.querySelector('.folder-project-images');
images.tabIndex = 0;
images.setAttribute('aria-label', 'Project images — scroll to explore');

// Leave the next image fully below the initial image viewport.
const firstFigure = images.querySelector('figure');
function spaceNextImage() {
  firstFigure.style.marginBottom = '0px';
  if (!matchMedia('(min-width:821px)').matches) return;
  const gap = parseFloat(getComputedStyle(images).rowGap) || 0;
  const extra = Math.max(64, images.clientHeight - firstFigure.getBoundingClientRect().height - gap + 64);
  firstFigure.style.marginBottom = `${extra}px`;
}
new ResizeObserver(spaceNextImage).observe(images);
firstFigure.querySelector('img').addEventListener('load', spaceNextImage);
window.addEventListener('resize', spaceNextImage);
spaceNextImage();
images.scrollTop = 0;
window.addEventListener('pageshow', () => { spaceNextImage(); images.scrollTop = 0; });
// Let the final image reach the text's top edge without scrolling past it.
function setImageScrollLimit() {
  const figures = images.querySelectorAll('figure');
  const last = figures[figures.length - 1];
  if (!last || !matchMedia('(min-width:821px)').matches) {
    images.style.paddingBottom = '0px';
    return;
  }
  images.style.boxSizing = 'border-box';
  images.style.paddingBottom = `${Math.max(0, images.clientHeight - last.getBoundingClientRect().height)}px`;
}
new ResizeObserver(setImageScrollLimit).observe(images);
function observeImageSizes() {
  images.querySelectorAll('img').forEach(img => {
    if (!img.dataset.scrollLimitObserved) {
      img.dataset.scrollLimitObserved = 'true';
      img.addEventListener('load', setImageScrollLimit);
      imageSizeObserver.observe(img);
    }
  });
  setImageScrollLimit();
}
const imageSizeObserver = new ResizeObserver(setImageScrollLimit);
new MutationObserver(observeImageSizes).observe(images, { childList:true, subtree:true });
window.addEventListener('resize', setImageScrollLimit);
observeImageSizes();
const viewer = document.querySelector('.image-viewer');
const enlargedImage = viewer.querySelector('img');
images.addEventListener('click', event => {
  const link = event.target.closest('figure a');
  if (!link || event.ctrlKey || event.metaKey || event.shiftKey || event.altKey) return;
  event.preventDefault();
  enlargedImage.src = link.href;
  enlargedImage.alt = link.querySelector('img').alt;
  viewer.showModal();
});
viewer.querySelector('button').addEventListener('click', () => viewer.close());
viewer.addEventListener('click', event => { if (event.target === viewer) viewer.close(); });
viewer.addEventListener('cancel', event => { event.preventDefault(); viewer.close(); });
</script>
