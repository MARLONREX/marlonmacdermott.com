<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Phone preview</title><style>
*{box-sizing:border-box}html,body{height:100%;overflow:hidden}body{margin:0;background:#ededed;color:#3d3d3d;font:14px/1.4 Arial,sans-serif;display:flex;flex-direction:column;align-items:center;padding:12px;gap:10px}header{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:10px;flex:none}h1{font-size:16px;margin:0}select{font:inherit;padding:5px;max-width:45vw}.stage{flex:1;min-height:0;width:100%;display:flex;justify-content:center;align-items:center}.shell-space{position:relative;flex:none}.phone{position:absolute;top:0;left:0;padding:12px;background:#242424;border-radius:38px;box-shadow:0 10px 28px #0003;transform-origin:top left}iframe{display:block;border:0;border-radius:26px;background:#fff}footer{flex:none;font-size:12px;text-align:center;margin:0}
</style></head><body><header><h1>Phone preview</h1><select id="page" aria-label="Page"><option value="index.html">Homepage</option><option value="maup-4.html" selected>MAup 4</option><option value="maup-1.html">MAup 1</option><option value="maup-2.html">MAup 2</option><option value="maup-3.html">MAup 3</option><option value="countryside-cafe.html">Café</option><option value="climbing-centre-service-buildings.html">Climbing Centre</option><option value="house-competition.html">House Competition</option><option value="hazelwood.html">Hazelwood</option><option value="hawthorns.html">Hawthorns</option><option value="dry-stone-wall.html">Drystone Walling</option><option value="trace.html">TRACE</option><option value="about.html">Me</option><option value="contact.html">Contact</option></select><select id="size" aria-label="Phone size"><option value="390,844">390 × 844</option><option value="375,812">375 × 812</option><option value="430,932">430 × 932</option></select></header><main class="stage"><div class="shell-space"><div class="phone"><iframe src="maup-4.html" title="Website at phone width"></iframe></div></div></main><footer>Scroll inside the phone. The whole phone scales to fit your screen.</footer><script>
const stage=document.querySelector('.stage'),phone=document.querySelector('.phone'),frame=document.querySelector('iframe'),space=document.querySelector('.shell-space');
function fitPhone(){const [w,h]=document.querySelector('#size').value.split(',').map(Number);frame.style.width=w+'px';frame.style.height=h+'px';const width=w+24,height=h+24;phone.style.width=width+'px';phone.style.height=height+'px';const scale=Math.min(1,(stage.clientWidth-12)/width,(stage.clientHeight-12)/height);phone.style.transform='scale('+scale+')';space.style.width=width*scale+'px';space.style.height=height*scale+'px';}
document.querySelector('#size').addEventListener('change',fitPhone);document.querySelector('#page').addEventListener('change',e=>frame.src=e.target.value);new ResizeObserver(fitPhone).observe(stage);fitPhone();
</script></body></html>
